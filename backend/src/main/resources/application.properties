# ===============================
# APPLICATION
# ===============================
spring.application.name=crmsales

# ===============================
# DATABASE CONNECTION
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/crmsales
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Hibernate properties
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ===============================
# CONNECTION POOL (HikariCP)
# ===============================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ===============================
# SERVER CONFIGURATION
# ===============================
server.port=8899
app.frontend-url=http://localhost:4200

# ===============================
# JACKSON (JSON)
# ===============================
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=Asia/Jakarta

# ===============================
# MULTIPART FILE UPLOAD
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===============================
# MAIL CONFIGURATION
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=belalangsembah41@gmail.com
spring.mail.password=xfaozuhfuhezudxc
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ===============================
# JWT CONFIGURATION
# ===============================
jwt.secret=6dc05d8f6fd65ee812e54d4fa845910cdbb4edff881b850e429b885cfecad6ba
jwt.expiration=86400000

# ===============================
# QUARTZ SCHEDULER
# ===============================
spring.quartz.job-store-type=memory
spring.quartz.properties.org.quartz.scheduler.instanceName=CRMScheduler
spring.quartz.properties.org.quartz.scheduler.instanceId=AUTO

# ===============================
# SESSION MANAGEMENT
# ===============================
spring.session.store-type=none

# ===============================
# ACTUATOR (Monitoring)
# ===============================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.mail.enabled=false

# ===============================
# LOGGING
# ===============================
logging.level.root=INFO
logging.level.com.thefarhany.crmsales=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.file.name=logs/crm-sales.log

# ===============================
# FILE UPLOAD DIRECTORY
# ===============================
file.upload-dir=uploads/contracts

# URL Ollama (default port 11434)
spring.ai.ollama.base-url=http://localhost:11434

# Model AI
spring.ai.ollama.chat.options.model=gpt-oss:120b-cloud

# Kreativitas AI (0.0 - 1.0). 0.7 pas buat email bisnis.
spring.ai.ollama.chat.options.temperature=0.7