# ===============================
# PRODUCTION CONFIGURATION
# ===============================

# DATABASE
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/crmsales}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / HIBERNATE - use update for first deploy, then switch to validate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# QUARTZ - memory mode (no JDBC needed)
spring.quartz.job-store-type=memory
spring.quartz.properties.org.quartz.scheduler.instanceName=CRMScheduler
spring.quartz.properties.org.quartz.scheduler.instanceId=AUTO

# SESSION - disable JDBC session store (using JWT)
spring.session.store-type=none
spring.session.jdbc.initialize-schema=never
spring.autoconfigure.exclude=org.springframework.boot.session.jdbc.autoconfigure.JdbcSessionAutoConfiguration

# SERVER
server.port=${SERVER_PORT:8899}

# LOGGING
logging.level.root=INFO
logging.level.com.thefarhany.crmsales=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n